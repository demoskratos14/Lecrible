name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Le SDK Android est déjà préinstallé sur ubuntu-latest : on accepte juste les licences
      # (l'action android-actions/setup-android échoue sur cette image).
      - name: Accepter les licences du SDK Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Compiler l'APK (debug)
        run: gradle assembleDebug --stacktrace

      - name: Tests unitaires
        run: gradle testDebugUnitTest --stacktrace

      - name: Analyse lint
        run: gradle lintDebug --stacktrace

      - name: Publier l'APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LeCrible-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Publier le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LeCrible-rapport-tests
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

      - name: Publier le rapport lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LeCrible-rapport-lint
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
